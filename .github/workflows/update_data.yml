# .github/workflows/update_data.yml
name: Update Market Data

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 02:00 UTC (adjust as needed)
  workflow_dispatch:   # Allows manual triggering from the Actions tab

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for committing back

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt   # create this file if needed

      - name: Run data update script
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python scripts/fetch_latest_data.py   # adjust path as needed

      - name: Commit updated data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/   # folder where script writes files
          if git diff-index --quiet HEAD; then
            echo "No changes detected."
          else
            git commit -m "🔄 Update market data – ${{ github.run_id }}"
            git push
          fi
