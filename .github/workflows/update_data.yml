# .github/workflows/update_data.yml
name: Update Market Data

on:
  schedule:
    - cron: '0 21 * * *'  # Daily at 05:00 Taiwan time (UTC+8) to capture the completed U.S. session.
    - cron: '0 22 * * 6'  # Extra Sunday 06:00 Taiwan verification pass (Saturday 22:00 UTC).
  workflow_dispatch:   # Allows manual triggering from the Actions tab

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for committing back

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt   # create this file if needed
      - name: Run full sync pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: |
          python backend/sync_engine.py

      - name: Refresh Early Warning / crash predictor exports
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: |
          # Steps 1, 3, 4 need a local Windows OHLCV folder (D:\Codex projects\US-data)
          # that doesn't exist on the CI runner; they self-skip gracefully, but we
          # skip them explicitly to save time. Step 2 (crash predictor /
          # weekly_feature_outcomes.csv — what the Early Warning page reads) and
          # step 6 (Best Mix) are self-contained. Step 5 (R3 cache) only writes Thursdays.
          python daily_refresh.py --skip 1,3,4

      - name: Verify latest trading-day coverage and strategy payloads
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python backend/verify_daily_update.py

      - name: Commit updated data and generated strategy artifacts
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ backend/strategies/data/ exports/
          if git diff-index --quiet HEAD; then
            echo "No changes detected."
          else
            git commit -m "🔄 Update market data – ${{ github.run_id }}"
            git push
          fi
