# .github/workflows/update_data.yml
name: Update Market Data

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 02:00 UTC (adjust as needed)
  workflow_dispatch:   # Allows manual triggering from the Actions tab

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for committing back

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt   # create this file if needed
      - name: Run full sync pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: |
          python backend/sync_engine.py

      - name: Commit updated data and generated strategy artifacts
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ backend/strategies/data/ exports/
          if git diff-index --quiet HEAD; then
            echo "No changes detected."
          else
            git commit -m "🔄 Update market data – ${{ github.run_id }}"
            git push
          fi
