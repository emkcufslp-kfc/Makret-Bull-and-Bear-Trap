name: D3 Liquidity Telegram

on:
  schedule:
    - cron: "30 22 * * 5"
  workflow_dispatch:

jobs:
  send-d3-telegram:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh D3 study
        run: python backend/analyze_crash_predictors.py

      - name: Send D3 Telegram message
        run: python backend/send_d3_telegram.py
