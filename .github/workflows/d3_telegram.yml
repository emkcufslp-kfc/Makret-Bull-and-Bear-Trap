name: D3 Liquidity Data Refresh

on:
  schedule:
    - cron: "30 22 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-d3-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh D3 study
        run: python backend/analyze_crash_predictors.py

      - name: Commit refreshed D3 data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/crash_predictor_study/
          if git diff --cached --quiet; then
            echo "No refreshed D3 data changes to commit."
          else
            git commit -m "Update D3 liquidity data"
            git push
          fi
